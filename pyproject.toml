[project]
name = "duckdb-docs-assistant"
version = "0.1.0"
description = "Reproducible DuckDB documentation corpus builder for a hybrid RAG assistant."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
